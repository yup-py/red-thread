name: 'ott_analytics'
version: '1.0.0'
config-version: 2

profile: 'ott_snowflake_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ott_analytics:
    staging:
      +materialized: view
      +schema: STAGING
    intermediate:
      +schema: INTERMEDIATE
    marts:
      +schema: MARTS

seeds:
  ott_analytics:
    +schema: SEEDS