version: 2

models:
  - name: int_streaming_titles
    description: "Unmasked and consolidated catalog of titles across Netflix, Amazon Prime, Apple TV, and Hotstar."
    columns:
      - name: platform
        description: "The streaming platform providing the content (e.g., Netflix, Amazon Prime)."
        tests:
          - not_null
      - name: title
        description: "Standardized title name."
        tests:
          - not_null

  - name: int_box_office
    description: "Unified box office datasets combining Hollywood and Bollywood theatrical releases."
    columns:
      - name: title
        description: "Title of the theatrical release."
        tests:
          - not_null

  - name: int_title_genres
    description: "Normalizes comma-separated genres into single rows per title for clean dashboard filtering."
    columns:
      - name: title
        description: "Title associated with the genre."
        tests:
          - not_null
      - name: genre
        description: "Individual extracted genre."
        tests:
          - not_null